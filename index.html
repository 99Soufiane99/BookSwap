<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Swap</title>
    <link rel="stylesheet" href="./src/style.css">
</head>

<body bg-gray-50 text-gray-800>
    <header class="bg-white border-b border-gray-200">
        <nav class="max-w-6xl mx-auto px-4 py-4">
            <a href="index.html" class="text-xl font-bold text-green-800">BookSwap</a>
        </nav>
    </header>
    <main class="max-w-6xl mx-auto px-4 py-8">
        <section class="mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Demandes d'achange</h1>
            <p class="text-gray-500 mt-2">echange de livres</p>
        </section>
        <section>
            <input type="search" id="search" placeholder="Rechercher un livre"
                class="flex-1 border border-gray-300 rounded-lg px-4 py-3 bg-white outline-one focus:border-green-600">
            <select id="filter"
                class="border border-gray-300 rounded-lg px-4 bg-white outline-none focus:border-green-600">
                <option value="all"> Tous les echanges</option>
                <option value="permanent">Definitif</option>
                <option value="temporair">Temporaire</option>
            </select>
            <button type="button" id="bt-search" class="bg-green-700 text-white px-5 py-3 rounded-lg hover:bg-green-800">
                search
            </button>
        </section>
        <section>

            <div class="flex flex-wrap gap-5 p-5" id="book-menu">


            </div>
        </section>
        
<div id="book-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-xl p-6 relative">

        <button id="close-modal" class="absolute top-3 right-4 text-2xl text-gray-500">
            &times;
        </button>

        <div id="modal-content">
            
        </div>

    </div>

</div>

    </main>
    <script src="app.js"></script>
</body>

</html>
